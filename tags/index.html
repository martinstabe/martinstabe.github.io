---
layout: page
title: Tags
permalink: /tags/
---

<ul class="post-list">
  {% assign sorted_tags = site.tags | sort %}
  {% for tag in sorted_tags %}
    <li>
      <h2>
        <a class="post-link" href="/tags/{{ tag[0] }}/">{{ tag[0] }}</a>
      </h2>
      <p>{{ tag[1].size }} post{% if tag[1].size != 1 %}s{% endif %}</p>
    </li>
  {% endfor %}
</ul>
